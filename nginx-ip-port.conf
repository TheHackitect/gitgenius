# GitGenius Nginx Configuration for IP:PORT Hosting
# Use this when you don't have a domain name
#
# Usage: 
#   1. Copy to /etc/nginx/sites-available/gitgenius
#   2. Update SERVER_IP and PORT below
#   3. ln -s /etc/nginx/sites-available/gitgenius /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx

# Upstream for Next.js app
upstream gitgenius_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    # ================================================
    # CHANGE THESE VALUES TO YOUR SERVER IP AND PORT
    # ================================================
    listen 8080;                    # External port (what users access)
    # listen YOUR_PORT;
    
    # Optional: bind to specific IP if server has multiple interfaces
    # listen 192.168.1.50:8080;
    
    server_name _;  # Accept any hostname (works with IP access)
    
    # ================================================
    # END OF REQUIRED CHANGES
    # ================================================

    # Basic settings
    client_max_body_size 10M;

    # Security headers (still good practice even without HTTPS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones (define in http block or here)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Proxy to Next.js
    location / {
        proxy_pass http://gitgenius_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js static files - cache aggressively
    location /_next/static {
        proxy_pass http://gitgenius_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://gitgenius_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
